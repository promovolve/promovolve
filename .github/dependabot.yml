version: 2

# Keep Dependabot's default `dependencies` label.
updates:
  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
    # Slick modules share a release; unrelated dependencies need separate reviews.
    groups:
      slick-minor:
        applies-to: "version-updates"
        patterns: ["com.typesafe.slick:slick_*", "com.typesafe.slick:slick-hikaricp_*"]
        update-types: ["minor"]
      slick-patch:
        applies-to: "version-updates"
        patterns: ["com.typesafe.slick:slick_*", "com.typesafe.slick:slick-hikaricp_*"]
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directories:
      - "/platform/banner-bootstrap"
      - "/platform/banner-component"
      - "/platform/creative-designer"
      - "/platform/dashboard-tests"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "gomod"
    directory: "/platform"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "pip"
    directory: "/scripts/rl-test"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/platform"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/integrations/wordpress"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
