name: CI

on:
  push:
    # Pin-back uses pull_request CI; also running on ci/pins pushes would
    # duplicate the checks for the same update.
    branches: [main]
  pull_request:
  # Manual runs exist for the deploy gate: Deploy polls for a CI run on
  # its commit; if a HEAD somehow has none (an older "[skip ci]" pin
  # commit, say) the gate would time out after 30 minutes. Dispatching CI
  # on the same commit gives it something green.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scala:
    name: Scala core (sbt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      # Hard gate — the tree is scalafmt-clean (scala3 dialect); any drift fails
      # CI. Run `sbt scalafmtAll` before committing.
      - name: scalafmt check
        run: sbt scalafmtCheckAll

      # Behavioral gate. `test` compiles main + test sources and then RUNS the
      # suite, so an actor/auction/pacing/serialization regression fails here
      # instead of riding a green compile into a deploy. Tests that need a live
      # LLM key or a host ffmpeg carry the `promovolve.Integration` tag and are
      # excluded by build.sbt, which is what keeps this deterministic on a
      # clean runner — do not add credentials to make more of them run.
      - name: Test (main + test)
        run: sbt test

      # Package the production launcher and keep Java 25 native-access needs
      # explicit. LMDB (jnr-jffi) and Pekko's LZ4 support are classpath code,
      # so the expected module name is ALL-UNNAMED.
      - name: Stage API and scan native access
        run: |
          sbt "api / Universal / stage"
          test "$(jnativescan --release 25 --class-path 'modules/api/target/universal/stage/lib/*' --print-native-access)" = ALL-UNNAMED

  banner:
    name: Banner (unit + hostile environments)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/banner-component
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/banner-component/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Hostile-environment suite: the built bundle inside fixture pages
      # reproducing real-publisher hostility (strict CSP, Trusted Types,
      # transformed ancestors, quirks mode, CSS bombs, SPA remounts,
      # z-index wars, vertical writing). Known gaps are pinned in
      # tests/hostile/run.mjs and fail the suite if their shape changes.
      - run: npx playwright install chromium
      - run: npm run test:hostile

  designer:
    name: Creative designer (unit + animation viewability)
    runs-on: ubuntu-latest
    # The browser suite spawns vite + Chromium; a wedge there must fail
    # the job in minutes (the suite's own watchdog is 180s), not idle
    # into the runner's 6h default and stall the deploy gate. 20, not 10:
    # the budget also covers a COLD `playwright install` (~150MB), which
    # alone blew the 10-minute bound twice on slow runners (2026-08-18,
    # both runs of 1b3d36d died mid-download and gated the deploy). The
    # browser cache below makes warm runs fast; the timeout is the cold
    # path's headroom.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/creative-designer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/creative-designer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Verify embedded Designer assets
        run: npm run fanout -- --check
      # Animation viewability contract: collapsed-banner item motion must
      # HOLD until the banner is ≥50% visible (and the atomic reveal has
      # lifted), then play; reduced-motion poses instantly at render. The
      # gate is an IntersectionObserver, so this needs real Chromium —
      # the fixture imports the banner component from source via the
      # @banner vite alias (see tests/ratchet/anim-viewability.mjs).
      # Cache the browser download (~/.cache/ms-playwright) keyed on the
      # lockfile (restore-keys falls back to any seeded playwright cache).
      # NO --with-deps anywhere in this workflow: it apt-installs system
      # libs the ubuntu-latest image already carries, and a wedged apt
      # mirror hung that step for 20+ minutes THROUGH a warm browser
      # cache (2026-08-18, three gate failures in one night). If a future
      # runner image ever drops a shared lib, the suite fails naming the
      # missing .so — reinstate deps then, deliberately.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/creative-designer/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install chromium
      - run: npm run test:anim-viewability

  bootstrap:
    name: Bootstrap (publisher ad tag)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/banner-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/banner-bootstrap/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  datepicker:
    name: Dashboard date-picker (browser)
    runs-on: ubuntu-latest
    # Same bound + browser cache as the designer job: a wedged
    # `playwright install` sat 30+ minutes here with NO timeout
    # (2026-08-18, the 6a8d5a5 run) and held the whole CI run
    # in_progress past the deploy gate's 30-minute wait — green code,
    # failed deploy, twice in one night across two jobs.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/dashboard-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needs BOTH toolchains: the Go preview test renders the real pages
      # (PREVIEW_OUT), then Playwright drives the calendar in Chromium.
      # A render test alone cannot catch this component's failure mode —
      # Alpine boolean-attribute semantics only exist in a browser.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/dashboard-tests/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('platform/dashboard-tests/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install chromium
      - run: npm test

  go:
    name: Platform (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      # Share first-party build, vet, and race checks with local development.
      - run: make check

  go-billing-db:
    name: Platform billing (postgres)
    runs-on: ubuntu-latest
    # Separate from "Platform (go)" on purpose: this job pulls an image and
    # starts a container, so it has failure modes (registry, daemon, initdb)
    # the Docker-free job must never inherit.
    #
    # The money suite — transactionality, idempotency, local-day settlement,
    # holds, clawbacks — used to skip itself unless a database URL happened to
    # be set, which meant it protected nothing. Here it is mandatory: no
    # skip-on-missing-Docker fallback, because a silently green money suite is
    # worse than a red one.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum
      # Testcontainers provisions the pinned Postgres itself (TestMain), so
      # there is no service container here and no wait-for-healthy shim; on a
      # startup failure the test binary prints the container logs before
      # exiting non-zero.
      - run: go test -tags=integration ./internal/billing/ -count=1
  scala-db:
    name: Scala persistence (timescaledb)
    runs-on: ubuntu-latest
    # The `dbIt` project is not aggregated by root, so `sbt test` in the Scala
    # job never reaches these — they need Docker, pull a TimescaleDB image and
    # apply the real docker/init-db.sql. Nothing here skips on a missing
    # daemon: a container that will not start fails the job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
      # The Scala job's `scalafmtCheckAll` runs on the ROOT project, which does
      # not aggregate dbIt — so these sources need their own check or they
      # drift unformatted.
      - name: scalafmt check (dbIt)
        run: sbt dbIt/scalafmtCheckAll
      - name: Database integration tests
        run: sbt dbIt/test
  docker-config:
    name: Docker contexts and Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: python3 scripts/test-docker-config.py

  docker-changes:
    name: Select Docker image checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ github.event_name == 'workflow_dispatch' && '["api","platform"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # PRs use their full diff; pushes use the range delivered to that branch.
          base: ${{ github.ref }}
          filters: |
            api:
              - '.github/workflows/ci.yml'
              - 'Dockerfile.api'
              - '.dockerignore'
              - 'build.sbt'
              - 'project/**'
              # Test sources do not ship in the staged production image.
              - 'modules/*/src/main/**'
              - 'docker/init-db.sql'
              - 'scripts/smoke-docker.py'
              - 'scripts/docker-smoke/**'
            platform:
              - '.github/workflows/ci.yml'
              - 'platform/Dockerfile'
              - 'platform/.dockerignore'
              - 'platform/go.mod'
              - 'platform/go.sum'
              - 'platform/**/*.go'
              - 'platform/templates/**'
              - 'platform/static/**'
              - 'platform/help/**'
              - 'platform/tailwind.config.js'
              - 'platform/tailwind.input.css'
              - 'docker/init-db.sql'
              - 'scripts/smoke-docker.py'

  docker:
    needs: docker-changes
    if: needs.docker-changes.outputs.images != '[]'
    name: Docker (${{ matrix.image }}, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.docker-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image == 'api' && '.' || 'platform' }}
          file: ${{ matrix.image == 'api' && 'Dockerfile.api' || 'platform/Dockerfile' }}
          platforms: linux/arm64
          push: false
          load: true
          tags: promovolve-${{ matrix.image }}:ci
          # Keep PR build caches separate from deployment caches.
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.image == 'api'
        with:
          distribution: temurin
          java-version: '21'
      - name: Smoke test packaged runtime
        run: python3 scripts/smoke-docker.py ${{ matrix.image }} promovolve-${{ matrix.image }}:ci
