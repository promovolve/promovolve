<!doctype html><html><head><meta charset="utf-8"><title>focus ring</title>
<style>
  /* WordPress block themes (Twenty Twenty-Four/Five global styles): every
     focused element inside the site blocks gets a solid outline in the text
     colour. A focused reader button inside our shadow root makes the host
     match :focus, so this would ring the slot. */
  body { color: #111; }
  :where(.wp-site-blocks :focus) { outline-width: 2px; outline-style: solid; }
</style></head><body>
<div class="wp-site-blocks">
  <div id="slot" style="width:300px;height:250px;"></div>
</div>
<script src="/dist/expandable-magazine-banner.js"></script>
<script src="/tests/hostile/fixtures/_seed.js"></script>
</body></html>
