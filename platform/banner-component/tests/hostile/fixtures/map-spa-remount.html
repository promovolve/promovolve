<!doctype html><html><head><meta charset="utf-8"><title>map spa remount</title></head><body>
<div id="app"><div id="slot" style="width:300px;height:250px;"></div></div>
<script src="/dist/expandable-magazine-banner.js"></script>
<script src="/tests/hostile/fixtures/_seed-map.js"></script>
<script>
  // Framework re-render, triggered by the probe AFTER the map is open (not
  // on a timer): the subtree is discarded and rebuilt while a live map
  // sits in the old element's shadow root / top layer.
  window.__swap = function () {
    document.getElementById("app").innerHTML = '<div id="slot" style="width:300px;height:250px;"></div>';
    var s = document.createElement("script");
    s.src = "/tests/hostile/fixtures/_seed-map.js";
    document.body.appendChild(s);
  };
</script>
</body></html>
